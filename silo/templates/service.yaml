apiVersion: v1
kind: Service
metadata:
  name: silo-web-svc
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: silo
spec:
  selector:
    app.kubernetes.io/name: silo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: jellyfin
      port: 8096
      targetPort: 8096
    - name: abs
      port: 13378
      targetPort: 13378
