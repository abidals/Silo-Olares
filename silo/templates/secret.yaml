apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: silo
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Silo's master key for at-rest credential encryption. Required to start
  # (>=32 chars); keep it separate from database dumps — losing it makes every
  # encrypted integration/storage credential unrecoverable.
  secret_key: {{ include "silo.secretKey" . | quote }}
