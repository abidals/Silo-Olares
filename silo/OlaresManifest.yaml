olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  silo: 1

metadata:
  name: silo
  icon: https://siloserver.org/web-app-icon-512.png
  description: Self-hosted media streaming server for films, series, audiobooks, ebooks, podcasts, and manga.
  appid: silo
  title: Silo
  version: '0.1.7'
  categories: [Fun]

entrances:
- name: silo
  host: silo-web-svc
  port: 8080
  icon: https://siloserver.org/web-app-icon-512.png
  title: Silo
  authLevel: public
  openMethod: window

spec:
  versionName: '1.0.0-build.latest'
  fullDescription: |
    Silo is a self-hosted media server for films, series, audiobooks, ebooks, podcasts, and manga,
    running on modern infrastructure: a Go backend, a React web UI, PostgreSQL 18 + pgvector, Redis,
    and hardware transcoding (QSV / VAAPI / NVENC). It ships Jellyfin-compatible and Audiobookshelf-
    compatible APIs so existing clients can connect.

    - Native web UI plus native iOS / macOS / Android / tvOS clients
    - Hardware-accelerated transcoding (Intel QSV/VAAPI, NVIDIA NVENC)
    - Jellyfin v13 and Audiobookshelf client compatibility
    - Pluggable libraries, providers, storage backends (local, S3/MinIO), and search (Meilisearch)
    - Runs on the official ghcr.io/silo-server/silo-server image with system PostgreSQL + Redis middleware
  upgradeDescription: |
    v0.1.7: Adds Intel VA-API/QSV hardware transcoding (mode intel — Arc dGPU or
    iGPU; Olares 1.12.6 passthroughs /dev/dri with LIBVA_DRIVER_NAME=iHD, 1.12.7+
    uses gpu-inject) and declares arm64 support (upstream images are multi-arch).
    NVIDIA mode unchanged.
    v0.1.6: Fixes the crash-loop with upstream's new "Silo omnibus" image
    (s6-overlay, Entrypoint /init, build-1883+): the charts' legacy
    args: ["server"] was interpreted by rc.init as a nonexistent service
    ("server: not found"), killing the app at every start. Args removed —
    the role stays env-driven (MODE et al). Also adds submitter metadata.
    v0.1.5: Raises the envelope to 8 cores / 8Gi (requests 1 core / 3Gi) so
    NVENC transcode, the library scanner, and in-app jellyfin-web asset builds
    ("Install Web UI") never contend inside one 4-core/4Gi cgroup. GPU and
    disk envelopes unchanged.
    v0.1.4: Wires NVIDIA NVENC hardware transcoding. Declares cpu+nvidia
    accelerator modes (RTX 3090 Ti via HAMi), adds the gpu-inject annotation and
    NVIDIA_VISIBLE_DEVICES/NVIDIA_DRIVER_CAPABILITIES=compute,video,utility so
    the driver's encode libs (libnvidia-encode) are mounted — the same recipe
    upstream's docker-compose.nvidia.yml uses. CPU fallback retained.
    v0.1.3: Raises the resource envelope for real-time playback — server CPU
    limit 1 -> 4 cores, memory limit 2Gi -> 4Gi (requests 100m/1Gi ->
    500m/2Gi, requiredDisk 100Mi -> 1Gi). Matches the official Jellyfin
    chart's envelope on this node; the prior 1-core limit starved software
    transcodes (API + library scan + ffmpeg share the cgroup), causing
    lag/buffering. Hardware QSV/VAAPI/NVENC remains CPU-fallback in this
    version (no GPU devices wired; follow-up item).
    v0.1.2: Switches the Silo image to imagePullPolicy: Always so every rollout/pod
    restart picks up the newest upstream ghcr.io/silo-server/silo-server:latest build.
    The current rollout additionally refreshes the previously cached image.
    v0.1.1: Mounts the user's connected NAS storage (External area, LarePass SMB shares)
    inside the container at /mnt/media/Media, so Silo libraries can use NAS paths such as
    /mnt/media/Media/Movies or /mnt/media/Media/TV Shows. No changes to data, middleware,
    or entrances.
    v0.0.1: Initial port of Silo (pre-1.0, latest main build) with system PostgreSQL and Redis middleware.
  developer: Silo-Server
  submitter: abidals
  website: https://siloserver.org/
  sourceCode: https://github.com/Silo-Server/silo-server
  doc: https://github.com/Silo-Server/silo-server/blob/main/docs/wiki/index.md
  license:
  - text: AGPL-3.0-or-later
    url: https://github.com/Silo-Server/silo-server?tab=AGPL-3.0-or-later#readme
  supportArch:
  - amd64
  - arm64
  # Accelerator-declared app (mutually exclusive with the flat required*/limited*
  # envelope).cpu runs on every architecture; nvidia covers NVENC rigs (amd64);
  # intel covers VA-API/QSV rigs (Intel Arc/iGPU, amd64; unified memory — the
  # iGPU/dGPU draws from pod memory, so no GPUMemory fields — lint forbids them
  # on non-discrete-mode entries). Olares exposes an Arc A770 dGPU under the
  # 'intel' node label (gpu.bytetrade.io/intel=true).
  accelerator:
  - mode: cpu
    requiredCpu: "1"
    limitedCpu: "8"
    requiredMemory: 3Gi
    limitedMemory: 8Gi
    requiredDisk: 1Gi
    limitedDisk: 20Gi
  - mode: nvidia
    supportMultiCard: false
    supportMultiNodes: false
    requiredCpu: "1"
    limitedCpu: "8"
    requiredMemory: 3Gi
    limitedMemory: 8Gi
    requiredDisk: 1Gi
    limitedDisk: 20Gi
    # NVENC sessions don't hold model weights; 2Gi/4Gi covers decode+encode
    # surfaces for several concurrent sessions.
    requiredGPUMemory: 2Gi
    limitedGPUMemory: 4Gi
  - mode: intel
    requiredCpu: "1"
    limitedCpu: "8"
    requiredMemory: 3Gi
    limitedMemory: 8Gi
    requiredDisk: 1Gi
    limitedDisk: 20Gi
  # spec.runAsUser intentionally left OFF: the official silo image has no USER directive
  # (ENTRYPOINT ["silo"] starts as root) and writes its durable data to the always-on system
  # PostgreSQL/Redis middleware plus a read-only media mount, not to a userspace dir that needs
  # uid-1000 chowning. Forcing a pod-level uid is unnecessary here.

permission:
  appData: true
  externalData: true

options:
  apiTimeout: 0
  # PostgreSQL + Redis are always-on system middleware (like Gitea/Immich), so
  # they are declared via the `middleware:` usage block below rather than as hard
  # `options.dependencies`. Declaring them here as version-gated deps caused two
  # regressions: (1) blank rows in the app's Dependency section, and (2) a strict
  # install pre-check that failed when the system middleware version could not be
  # reported (e.g. kvrocks at 0 nodes). The usage block still declares Silo's real
  # needs (PostgreSQL + pgvector, Redis namespace) and drives DB/namespace creation.
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system

middleware:
  postgres:
    username: silo
    databases:
    - name: silo
      extensions:
      - vector   # Silo's schema uses pgvector (embedding columns + HNSW index)
  redis:
    namespace: silo
